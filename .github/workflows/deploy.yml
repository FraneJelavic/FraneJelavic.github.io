name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: "0.164.0"
  ACTIONLINT_VERSION: "1.7.12"
  LYCHEE_VERSION: "0.24.2"

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Require main ref
        env:
          DEPLOYMENT_REF: ${{ github.ref }}
        run: |
          if [[ "${DEPLOYMENT_REF}" != "refs/heads/main" ]]; then
            printf 'Deployment validation requires refs/heads/main; received %s\n' "${DEPLOYMENT_REF}" >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install pinned validation tools
        run: ./scripts/install-ci-tools.sh

      - name: Run acceptance checks
        run: make check

      - name: Lint GitHub Actions workflows
        run: actionlint .github/workflows/check.yml .github/workflows/deploy.yml

      - name: Build output for internal-link validation
        run: |
          set -Eeuo pipefail
          link_output="${RUNNER_TEMP}/site-link-check"
          hugo \
            --gc \
            --minify \
            --panicOnWarning \
            --environment production \
            --noBuildLock \
            --cacheDir "${RUNNER_TEMP}/hugo-cache-link-check" \
            --destination "${link_output}"
          printf 'LINK_CHECK_OUTPUT=%s\n' "${link_output}" >> "${GITHUB_ENV}"

      - name: Validate generated internal links
        run: >-
          lychee
          --offline
          --include-fragments
          --root-dir "${LINK_CHECK_OUTPUT}"
          "${LINK_CHECK_OUTPUT}/**/*.html"

  build:
    name: Build site
    runs-on: ubuntu-24.04
    needs: validate
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install pinned validation tools
        run: ./scripts/install-ci-tools.sh

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo-cache
          HUGO_ENVIRONMENT: production
        run: >-
          hugo
          --gc
          --minify
          --panicOnWarning
          --noBuildLock
          --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    name: Deploy site
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
