name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: "0.164.0"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pinned Hugo
        run: |
          set -Eeuo pipefail

          downloads_dir="${RUNNER_TEMP}/hugo-download"
          install_dir="${RUNNER_TEMP}/hugo-bin"
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${downloads_dir}" "${install_dir}"
          cd "${downloads_dir}"

          curl --fail --location --silent --show-error --remote-name \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          curl --fail --location --silent --show-error --remote-name \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          grep "  ${archive}$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${install_dir}" hugo
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo-cache
          HUGO_ENVIRONMENT: production
        run: >-
          hugo
          --gc
          --minify
          --panicOnWarning
          --noBuildLock
          --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    name: Deploy site
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
