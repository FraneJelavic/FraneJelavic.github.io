name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: "0.164.0"
  ACTIONLINT_VERSION: "1.7.12"
  LYCHEE_VERSION: "0.24.2"

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install pinned validation tools
        run: ./scripts/install-ci-tools.sh

      - name: Run acceptance checks
        run: make check

      - name: Lint GitHub Actions workflows
        run: actionlint .github/workflows/check.yml .github/workflows/deploy.yml

      - name: Build output for internal-link validation
        run: |
          set -Eeuo pipefail
          link_output="${RUNNER_TEMP}/site-link-check"
          hugo \
            --gc \
            --minify \
            --panicOnWarning \
            --environment production \
            --noBuildLock \
            --cacheDir "${RUNNER_TEMP}/hugo-cache-link-check" \
            --destination "${link_output}"
          printf 'LINK_CHECK_OUTPUT=%s\n' "${link_output}" >> "${GITHUB_ENV}"

      - name: Validate generated internal links
        run: >-
          lychee
          --offline
          --include-fragments
          --root-dir "${LINK_CHECK_OUTPUT}"
          "${LINK_CHECK_OUTPUT}/**/*.html"
