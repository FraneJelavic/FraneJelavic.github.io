{{ define "main" }}
  <article class="page">
    <header class="page__header">
      <h1>{{ .Title }}</h1>
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
    {{ if .Params.showProfileLinks }}
      <nav class="profile-links" aria-label="Profiles">
        {{ partial "social-links.html" . }}
      </nav>
    {{ end }}
  </article>
{{ end }}
