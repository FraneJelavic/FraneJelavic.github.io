<div class="table-scroll" role="region" aria-label="Scrollable table" tabindex="0">
  <table>
    <thead>
      {{- range .THead }}
        <tr>
          {{- range . }}
            <th{{ with .Alignment }}{{ printf ` style="text-align: %s"` . | safeHTMLAttr }}{{ end }}>{{ .Text }}</th>
          {{- end }}
        </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
        <tr>
          {{- range . }}
            <td{{ with .Alignment }}{{ printf ` style="text-align: %s"` . | safeHTMLAttr }}{{ end }}>{{ .Text }}</td>
          {{- end }}
        </tr>
      {{- end }}
    </tbody>
  </table>
</div>
